name: "버그 신고 / Bug report"
description: "비민감 합성 정보로 재현 가능한 AroDamA 문제를 신고합니다."
title: "[Bug] "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        감사합니다. Issue 하나에는 문제 하나만 적어 주세요.

        실제 클립보드 글·이미지·파일 목록·HTML·RTF·OCR 결과, DB, 백업, 암호, 자격증명,
        사용자명·개인 경로, 고객 자료, 업무 기밀, 토큰·키 또는 원본 전체 로그를 올리지 마세요.
        보안 영향이나 악용 가능성이 있으면 공개 Issue를 만들지 말고
        [비공개 보안 신고](https://github.com/pcssakinc/pcssak-arodama-releases/security/advisories/new)를 사용하세요.
  - type: input
    id: app_version
    attributes:
      label: "AroDamA 버전 / Version"
      description: "앱의 정보 화면에 표시된 버전입니다."
      placeholder: "예: 0.4.1 / e.g. 0.4.1"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: "아키텍처 / Architecture"
      options:
        - "x64"
        - "x86"
        - "알 수 없음 / Unknown"
    validations:
      required: true
  - type: dropdown
    id: windows_edition
    attributes:
      label: "Windows 환경"
      options:
        - "Windows 11 Home x64"
        - "Windows 11 Pro x64"
        - "Windows 10 22H2 Home x64"
        - "Windows 10 22H2 Pro x64"
        - "Windows 10 22H2 Home x86"
        - "Windows 10 22H2 Pro x86"
        - "미지원 또는 알 수 없음 / Unsupported or unknown"
    validations:
      required: true
  - type: input
    id: windows_build
    attributes:
      label: "Windows 빌드 / Build"
      description: "winver의 버전과 OS 빌드만 적고 PC 이름·사용자명은 제거하세요."
      placeholder: "예: 23H2, OS 빌드 22631.XXXX"
    validations:
      required: true
  - type: dropdown
    id: install_source
    attributes:
      label: "설치 경로 / Install source"
      options:
        - "PCSSAK 공식 제품 페이지"
        - "공식 GitHub 버전 고정 Release"
        - "기타 또는 알 수 없음"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "문제 영역 / Affected area"
      options:
        - "설치·시작·종료"
        - "클립보드 수집"
        - "기록·검색·날짜·종류 필터"
        - "복사·붙여넣기·서식"
        - "자주 쓰는 문구"
        - "태그·보드·순차 붙여넣기·OCR"
        - "삭제·복구·영구 삭제"
        - "백업·복원"
        - "업데이트"
        - "UI·배율·접근성·번역"
        - "기타"
    validations:
      required: true
  - type: dropdown
    id: clipboard_kind
    attributes:
      label: "데이터 종류 / Data type"
      options:
        - "텍스트"
        - "서식 있는 글(HTML 또는 RTF)"
        - "이미지"
        - "실제 파일"
        - "가상 파일"
        - "혼합"
        - "해당 없음 또는 알 수 없음"
    validations:
      required: true
  - type: input
    id: display_scale
    attributes:
      label: "화면 배율 / Display scale"
      description: "UI 문제라면 해상도, Windows 배율, 모니터 수를 적으세요."
      placeholder: "예: 1920x1080, 125%, 모니터 1대"
  - type: textarea
    id: observed
    attributes:
      label: "실제 동작 / What happened"
      description: "민감정보를 제거한 합성 예시로 증상과 표시된 오류를 설명하세요."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "기대 동작 / Expected behavior"
      description: "어떤 안전하고 정확한 결과를 기대했는지 적으세요."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "재현 순서 / Reproduction steps"
      description: "새 합성 데이터로 반복할 수 있는 최소 순서를 번호로 적으세요."
      placeholder: |
        1. 수집을 켭니다.
        2. 합성 텍스트를 복사합니다.
        3. ...
    validations:
      required: true
  - type: dropdown
    id: data_safety
    attributes:
      label: "데이터 안전 상태 / Data safety"
      options:
        - "데이터 변화 없음"
        - "위험 동작을 안전하게 거부함"
        - "기존 데이터가 정상적으로 남아 있음"
        - "확실하지 않아 즉시 사용을 중단함"
        - "손실 또는 손상이 의심됨"
    validations:
      required: true
  - type: textarea
    id: sanitized_evidence
    attributes:
      label: "비식별 증거 / Sanitized evidence"
      description: "필요할 때만 비민감 오류 코드나 직접 정리한 짧은 진단을 붙이세요. 원본 로그는 금지합니다."
  - type: checkboxes
    id: confirmations
    attributes:
      label: "확인 / Confirmations"
      options:
        - label: "기존 Issue를 검색했고 이 신고에는 문제 하나만 담았습니다."
          required: true
        - label: "실제 클립보드 내용, DB, 백업, 자격증명, 개인 경로, 고객·기밀 자료를 첨부하지 않았습니다."
          required: true
        - label: "악용 가능한 보안 문제라면 이 양식 대신 비공개 보안 신고를 사용하겠습니다."
          required: true
